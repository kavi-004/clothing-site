<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Élan Boutique</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body> 

    <div class="navbar">
        <h1 onclick="location.href='index.html'">Élan Boutique</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="deals.html">Deals</a>
            <a href="myaccount.html">My Account</a>
            <a href="Cart.html" class="active">🛒Cart</a>
        </nav>
    </div>

    <div class="empty-cart-message">
        <br><br><br><br>
        <h2>Ooops! Your cart is empty.</h2>
        <button class="checkout-btn" onclick="location.href='checkout.html'">Checkout</button>
        <br><br><br><br><br><br><br>
        <p>Looks like you haven't added anything to your cart yet. Browse our collections and find your favorites!</p>
        <button class="shop-button" onclick="location.href='index.html'">Let’s Go Shopping</button>
    </div>
    
    <div class="cart-container"></div>
    
    
    
    <!-- Totals Section (Hidden initially) -->
    <div class="cart-totals" style="display: none;">
        <p>Gross Total: <span class="gross-total">LKR 0.00</span></p>
        <p>Discount: <span class="discount">LKR 0.00</span></p>
        <p><strong>Net Total: <span class="net-total">LKR 0.00</span></strong></p>
        <button class="checkout-btn" onclick="location.href='checkout.html'">Checkout</button>
    </div>
    

    
    <script src="cart.js"></script>
    


    
</body>
</html>
