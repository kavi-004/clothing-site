<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dresses - Élan Boutique</title>
  <link rel="stylesheet" href="styles.css" >
</head>
<body> 

  <div class="navbar">
    <h1 onclick="location.href='index.html'">Élan Boutique</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="deals.html">Deals</a>
      <a href="myaccount.html">My Account</a>
      <a href="Cart.html">🛒Cart</a>
    </nav>
  </div>

  <div class="container">
    <h2>Dresses</h2>

    <div class="filter-search-bar">
      <input type="text" id="searchInput" placeholder="Search dresses..." >

      <label>Price:</label>
      <select id="priceFilter">
        <option value="">All</option>
        <option value="0-6000">Below Rs.6000</option>
        <option value="6000-10000">Rs.6000 - Rs.10000</option>
        <option value="10000-15000">Above Rs.10000</option>
      </select>

      <label>Color:</label>
      <select id="colorFilter">
        <option value="">All</option>
        <option value="white">White</option>
        <option value="black">Black</option>
        <option value="green">Green</option>
        <option value="brown">Brown</option>
      </select>
    </div>

    <div class="product-grid" id="dressesGrid">
      <div class="product-card">
        <img src="dress1.jpg" alt="Brown High Neck Ruffled Long Sleeve Dress" >
        <p>High Neck Ruffled Long Sleeve Dress</p>
        <h4>Rs.5400</h4>
        <button onclick="location.href='dress1.html'">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="dress2.jpg" alt="black Off Shoulder Slit Dress" >
        <p>Off Shoulder Slit Dress</p>
        <h4>Rs.11500</h4>
        <button onclick="location.href='dress2.html'">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="dress3.jpg" alt="green Sleeveless V-Neck Slit Dress" >
        <p>Sleeveless V-Neck Slit Dress</p>
        <h4>Rs.9500</h4>
        <button onclick="location.href='dress3.html'">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="dress4.jpg" alt="white Off Shoulder Puff Sleeved Floral Dress" >
        <p>Off Shoulder Puff Sleeved Floral Dress</p>
        <h4>Rs.12500</h4>
        <button onclick="location.href='dress4.html'">Buy Now</button>
      </div>
    </div>
  </div>

  
  <script src="product.js"></script>

</body>
</html>
