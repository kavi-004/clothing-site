<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    

    <div class="navbar">
        <h1 onclick="location.href='index.html'">Élan Boutique</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="deals.html">Deals</a>
                <a href="myaccount.html">My Account</a>
                <a href="Cart.html">🛒Cart</a>
            </nav>
    </div>

    <div class="container">
        <h2>Skirts</h2>

        <div class="filter-search-bar">
            <input type="text" id="searchInput" placeholder="Search dresses..." />
    
            <label>Price:</label>
            <select id="priceFilter">
            <option value="">All</option>
            <option value="0-6000">Below Rs.6000</option>
            <option value="6000-10000">Rs.6000 - Rs.10000</option>
            <option value="10000-15000">Above Rs.10000</option>
            </select>
    
            <label>Color:</label>
            <select id="colorFilter">
            <option value="">All</option>
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="beige">Beige</option>
            <option value="brown">Brown</option>
            </select>
        </div>

        <div class="product-grid" id="skirtsGrid">
            
            <div class="product-card">
                <img src="skirt1.jpg" alt="Black High Waist Leather Bodycon Skirt">
                <p>High Waist Leather Bodycon Skirt</p>
                <h4>Rs.5600</h4>
                <button onclick="location.href='skirt1.html'">Buy Now</button>
            </div>
    
            <div class="product-card">
                <img src="skirt2.jpg" alt="Brown A-line Pleated Mini Skirt">
                <p>A-line Pleated Mini Skirt</p>
                <h4>Rs.4800</h4>
                <button onclick="location.href='skirt2.html'">Buy Now</button>
            </div>
    
            <div class="product-card">
                <img src="skirt3.jpg" alt="Beige Slim Fit High Waist Mini Skirt">
                <p>Slim Fit High Waist Mini Skirt</p>
                <h4>Rs.3800</h4>
                <button onclick="location.href='skirt3.html'">Buy Now</button>
            </div>
    
            <div class="product-card">
                <img src="skirt4.jpg" alt="White Flared Maxi skirt with Waist Chain">
                <p>Flared Maxi skirt with Waist Chain</p>
                <h4>Rs.5800</h4>
                <button onclick="location.href='skirt4.html'">Buy Now</button>
            </div>
        </div>

    </div>
    
  <script src="product.js"></script>
</body>
</html>
