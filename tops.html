<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    

    <div class="navbar">
        <h1 onclick="location.href='index.html'">Élan Boutique</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="deals.html">Deals</a>
                <a href="myaccount.html">My Account</a>
                <a href="Cart.html">🛒Cart</a>
            </nav>
    </div>
    
    <div class="container">
        <h2>Tops</h2>

        <div class="filter-search-bar">
            <input type="text" id="searchInput" placeholder="Search dresses..." />
    
            <label>Price:</label>
            <select id="priceFilter">
            <option value="">All</option>
            <option value="0-6000">Below Rs.6000</option>
            <option value="6000-10000">Rs.6000 - Rs.10000</option>
            <option value="10000-15000">Above Rs.10000</option>
            </select>
    
            <label>Color:</label>
            <select id="colorFilter">
            <option value="">All</option>
            <option value="white">White</option>
            <option value="black">Black</option>
            <option value="red">Red</option>
            </select>
        </div>
  
        <div class="product-grid" id="topsGrid">

            <div class="product-card">
                <img src="top1.jpg" alt="Black & white Long Sleeve V-Neck Fitted Top"> 
                <p>Long Sleeve V-Neck Fitted Top</p>
                <h4>Rs.3850</h4>
                <button onclick="location.href='top1.html'">Buy Now</button>
            </div>

            <div class="product-card">
                <img src="top2.jpg" alt=" redLong Sleeve Sheer Cropped Top">
                <p>Long Sleeve Sheer Cropped Top</p>
                <h4>Rs.2900</h4>
                <button onclick="location.href='top2.html'">Buy Now</button>
            </div>

            <div class="product-card">
                <img src="top3.jpg" alt="black Off Shoulder Mesh Top">
                <p>Off Shoulder Mesh Top</p>
                <h4>Rs.2800</h4>
                <button onclick="location.href='top3.html'">Buy Now</button>
            </div>

            <div class="product-card">
                <img src="top4.jpg" alt="white Printed Lettuce Trim Long Sleeve Top">
                <p>Butterfly Printed Long Sleeve Top</p>
                <h4>Rs.3700</h4>
                <button onclick="location.href='top4.html'">Buy Now</button>
            </div>

        </div>
        
    </div>
    
  <script src="product.js"></script>
</body>
</html>
